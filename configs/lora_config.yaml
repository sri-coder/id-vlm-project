# LoRA fine-tuning config for Qwen2-VL-2B-Instruct
# Tune these once you have a working baseline run -- don't tune blind.

model_name: "Qwen/Qwen2-VL-2B-Instruct"

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  max_samples: null   # set to e.g. 500 for a fast debug run

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:      # attention + MLP projections, standard for Qwen2-VL
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "outputs"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  bf16: true
  load_in_4bit: true   # keep true even on Colab T4 -- 2B model, saves memory/time
